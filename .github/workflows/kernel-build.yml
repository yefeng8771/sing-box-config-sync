# Build reF1nd sing-box kernel from source (reF1nd has no Releases).
# Locks the testing-next commit, builds linux/arm64 (+ android/arm64),
# records hashes into kernel.lock, and runs sing-box check on the built config.
name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      refind_commit:
        description: 'reF1nd-testing-next commit (empty = latest)'
        required: false
        default: ''
      targets:
        description: 'GOOS/GOARCH pairs, comma separated'
        required: false
        default: 'linux/arm64,android/arm64'

permissions:
  contents: write

env:
  # From reF1nd release/DEFAULT_BUILD_TAGS_OTHERS (+ with_musl for OpenWrt);
  # v1: no with_ebpf (TUN + auto_redirect instead)
  BUILD_TAGS: with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0,with_musl

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: config-repo

      - name: Resolve reF1nd commit
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.refind_commit }}" ]; then
            echo "sha=${{ inputs.refind_commit }}" >> "$GITHUB_OUTPUT"
          else
            sha="$(gh api repos/reF1nd/sing-box/commits/reF1nd-testing-next --jq '.sha')"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi
          echo "building reF1nd-testing-next @ $(cat $GITHUB_OUTPUT | grep sha | cut -d= -f2 | cut -c1-12)"

      - uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: ${{ steps.commit.outputs.sha }}
          path: sing-box

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: sing-box/go.sum

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist-bin
          IFS=',' read -ra PAIRS <<< "${{ inputs.targets }}"
          for pair in "${PAIRS[@]}"; do
            goos="${pair%%/*}"; goarch="${pair##*/}"
            out="dist-bin/sing-box-${goos}-${goarch}"
            echo "== building $goos/$goarch"
            ( cd sing-box && GOOS="$goos" GOARCH="$goarch" \
              go build -v -trimpath -o "../$out" -tags "$BUILD_TAGS" ./cmd/sing-box )
          done
          # host binary (linux/amd64) just for running `check` in CI
          ( cd sing-box && go build -trimpath -o ../dist-bin/sing-box-check \
              -tags "$BUILD_TAGS" ./cmd/sing-box )
          ( cd dist-bin && sha256sum sing-box-linux-* sing-box-android-* > SHA256SUMS )
          cat dist-bin/SHA256SUMS

      - name: Build config + sing-box check
        run: |
          set -euo pipefail
          cd config-repo
          pip install pyyaml -q
          python build/build.py --device router --out dist/router.json
          python build/build.py --device phone --out dist/phone.json
          ../dist-bin/sing-box-check check -c dist/router.json
          ../dist-bin/sing-box-check check -c dist/phone.json
          echo "check OK (router + phone)"

      - name: Update kernel.lock
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          cd config-repo
          python3 - "$COMMIT_SHA" <<'EOF'
          import json, sys, hashlib
          from pathlib import Path
          sha = sys.argv[1]
          dist = Path("../dist-bin")  # workflow root，config-repo 之外
          hashes = {}
          for f in sorted(dist.glob("sing-box-*")):
              if f.name in ("SHA256SUMS", "sing-box-check"):
                  continue
              h = hashlib.sha256(f.read_bytes()).hexdigest()
              # sing-box-linux-arm64 -> linux_arm64
              key = f.name.removeprefix("sing-box-").replace("/", "_").replace("-", "_")
              hashes[key] = h
          lock_p = Path("kernel.lock")
          lock = {"current": None, "history": []}
          if lock_p.exists():
              import yaml
              lock = yaml.safe_load(lock_p.read_text()) or lock
          entry = {"commit": sha, **{f"{k}_sha256": v for k, v in hashes.items()}}
          hist = [entry]
          if lock.get("current"):
              hist.append(lock["current"])
          hist.extend(lock.get("history", []))
          # keep latest 3 rollback versions (dedupe by commit)
          seen, dedup = set(), []
          for e in hist:
              if e["commit"] not in seen:
                  seen.add(e["commit"])
                  dedup.append(e)
          lock["current"] = dedup[0]
          lock["history"] = dedup[1:4]
          import yaml
          lock_p.write_text(yaml.safe_dump(lock, sort_keys=False) + "\n")
          print(lock_p.read_text())
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-kernel-${{ steps.commit.outputs.sha }}
          path: |
            dist-bin/
            config-repo/dist/router.json
            config-repo/dist/phone.json
          retention-days: 30

      - name: Commit kernel.lock
        run: |
          set -euo pipefail
          cd config-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kernel.lock
          if git diff --cached --quiet; then
            echo "kernel.lock unchanged"
          else
            git commit -m "chore(kernel): lock reF1nd-testing-next @ ${{ steps.commit.outputs.sha }}"
            git push
          fi
