name: Sync Sources

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间 08:00
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs; never cancel a push already in progress.
concurrency:
  group: sync-sources
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test sync and normalization
        run: python -m unittest discover -s tests -v
      - name: Sync sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync.py
      - name: Normalize supported sources
        run: python normalize.py
      - name: Commit and push to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sources normalized .sync-meta.json
          if git diff --cached --quiet; then
            echo 'No changes to sync.'
            exit 0
          fi
          git commit -m "chore(sync): update upstream sources $(date -u +'%Y-%m-%d')"
          # Fast-forward only: if main changed since checkout, fail without overwriting.
          git push origin HEAD:refs/heads/main
