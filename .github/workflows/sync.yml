name: Sync Sources

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间 08:00
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs; never cancel a push already in progress.
concurrency:
  group: sync-sources
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pyyaml
      - name: Test sync, normalization, and AST migration compiler
        run: python -m unittest discover -s tests -v
      - name: Sync sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync.py
      - name: Normalize supported sources
        run: |
          set -o pipefail
          python normalize.py 2>&1 | tee /tmp/normalize-sync.log
      - name: Report normalization outcome
        if: always()
        run: |
          if [ -f /tmp/normalize-sync.log ]; then
            echo '## 文件规范化结果' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -100 /tmp/normalize-sync.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Classify raw pk-box templates
        run: python template_status.py
      - name: Extract self-evolving LLM Knowledge Base & AST Migration Rules
        run: python build/extract_kb.py
      - name: Run 1.15 AST Migration Audit across upstream templates
        run: python build/migrate.py --batch-audit --out dist/template-migration-audit.json
      - name: Commit and push to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sources normalized .sync-meta.json template-status.json dist/migration-rules.json dist/sing-box-llm-kb.md dist/template-migration-audit.json
          if git diff --cached --quiet; then
            echo 'No changes to sync.'
            exit 0
          fi
          git commit -m "chore(sync): update upstream sources & LLM migration KB $(date -u +'%Y-%m-%d')"
          # Fast-forward only: if main changed since checkout, fail without overwriting.
          git push origin HEAD:refs/heads/main
