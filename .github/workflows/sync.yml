name: Sync Sources

on:
  schedule:
    # daily 00:00 UTC (= 08:00 Beijing time)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      note:
        description: 'Manual sync run'
        required: false
        default: ''

permissions:
  contents: write

# Avoid overlapping concurrent sync runs.
concurrency:
  group: sync-sources
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync — everything up to date."
          else
            git commit -m "chore(sync): auto-update sources $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
